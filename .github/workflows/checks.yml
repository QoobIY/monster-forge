name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    name: Dependency-free SDK / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: make test-sdk PYTHON=python
      - run: python -m build
      - name: Verify SDK archives and licenses without third-party packages
        run: |
          for wheel in dist/*.whl; do
            for sdist in dist/*.tar.gz; do
              make test-dist PYTHON=python WHEEL="$wheel" SDIST="$sdist"
            done
          done

  portable-app:
    name: Standalone constructor, SDK and browser modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -e '.[app,dev]'
      - run: npm ci --ignore-scripts
      - run: npm run check:format
      - run: make check PYTHON=python
      - name: Verify public source and pinned constructor inputs
        run: python -m tools.check_release --scope repository
